name: Draft Pre-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS Universal
    runs-on: macos-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install Rust and macOS targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tagged candidate
        run: |
          pnpm check:version -- --tag "${GITHUB_REF_NAME}"
          pnpm check
          pnpm licenses:check
          swift test --package-path ../../legacy/macos-native --no-parallel

      - name: Build unsigned Universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --ci --no-sign

      - name: Stage macOS asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "release-assets/KaiMD_${version}_universal.dmg"
          app="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          lipo "$binary" -info

      - name: Upload macOS asset
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-macos
          path: apps/desktop/release-assets/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install Rust and Windows target
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
          rustup target add x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tagged candidate
        shell: bash
        run: |
          pnpm check:version -- --tag "${GITHUB_REF_NAME}"
          pnpm check
          pnpm licenses:check

      - name: Build unsigned Windows installers
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --ci --no-sign

      - name: Stage Windows assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Expected both NSIS and MSI installers." }
          Copy-Item $exe.FullName "release-assets/KaiMD_${version}_x64-setup.exe"
          Copy-Item $msi.FullName "release-assets/KaiMD_${version}_x64_en-US.msi"

      - name: Upload Windows assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-windows
          path: apps/desktop/release-assets/*
          if-no-files-found: error

  draft-release:
    name: Create Draft Pre-release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Add notices and checksums
        run: |
          cp THIRD_PARTY_NOTICES.md release-assets/
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create unpublished pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --draft \
            --prerelease \
            --verify-tag \
            --title "KaiMD ${GITHUB_REF_NAME} (Alpha)" \
            --notes "Unsigned alpha candidate. Complete docs/RELEASE_CHECKLIST.md and update these notes before manually publishing this draft."
